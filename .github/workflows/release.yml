name: Release

# Pushing to main publishes a release for the version in project.godot
# (application/config/version) if that version has no release yet.
# The game's auto-updater downloads Furria.pck (older builds: Savia.pck) from the latest release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (start with -a to update players without asking)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GODOT_VERSION: 3.5.3

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot | head -n1)
          test -n "$version"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $version already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Godot and Windows export templates
        if: steps.version.outputs.exists == 'false'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux_headless.64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux_headless.64" >> "$GITHUB_ENV"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tpl="$HOME/.local/share/godot/templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q -j templates.tpz templates/windows_64_release.exe templates/windows_64_debug.exe templates/version.txt -d "$tpl"
          rm godot.zip templates.tpz

      - name: Import project
        if: steps.version.outputs.exists == 'false'
        run: |
          cp .github/godot/export_presets.cfg export_presets.cfg
          # A fresh checkout has no .import cache; let the editor import everything once.
          # The editor never exits on its own, so stop it once .import stops growing for 60s.
          "$GODOT" --no-window --editor --path . > import.log 2>&1 &
          pid=$!
          prev=-1; stable=0
          for i in $(seq 1 180); do
            sleep 5
            n=$(ls .import 2>/dev/null | wc -l)
            if [ "$n" -gt 0 ] && [ "$n" = "$prev" ]; then stable=$((stable + 1)); else stable=0; fi
            prev=$n
            [ "$stable" -ge 12 ] && break
          done
          kill "$pid" || true
          wait "$pid" || true
          echo "imported $prev files"

      - name: Export Windows build
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          "$GODOT" --no-window --path . --export "Windows Desktop" "$PWD/dist/Furria.exe"
          test -f dist/Furria.exe && test -f dist/Furria.pck
          # Put the Furria icon on the exe (replaces the template's GODOT_ICON group).
          npx -y resedit-cli@2.0.0 --in dist/Furria.exe --out dist/Furria-icon.exe --icon GODOT_ICON,icon.ico
          mv dist/Furria-icon.exe dist/Furria.exe
          (cd dist && zip -q -r "../Furria-$TAG-windows.zip" .)
          # Installs from before the rename look for Savia.pck when updating.
          mkdir -p legacy && cp dist/Furria.pck legacy/Savia.pck

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          notes="$NOTES"
          if [ -z "$notes" ]; then
            notes="Furria $TAG for Windows. Unzip and run Furria.exe. Existing installs update automatically."
          fi
          gh release create "$TAG" "Furria-$TAG-windows.zip" dist/Furria.pck legacy/Savia.pck \
            --target "$GITHUB_SHA" --title "Furria $TAG" --notes "$notes"
