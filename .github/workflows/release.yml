name: Release

# Pushing to main publishes a release for the version in project.godot
# (application/config/version) if that version has no release yet.
# The game's auto-updater downloads Chromia.pck (older builds: Furria.pck, Savia.pck) from the latest release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (start with -a to update players without asking)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GODOT_VERSION: 3.5.3

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.version.outputs.exists == 'false' }}
      ios: ${{ steps.ios.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot | head -n1)
          test -n "$version"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $version already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Godot and export templates
        if: steps.version.outputs.exists == 'false'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux_headless.64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux_headless.64" >> "$GITHUB_ENV"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tpl="$HOME/.local/share/godot/templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q -j templates.tpz templates/windows_64_release.exe templates/windows_64_debug.exe templates/webassembly_release.zip templates/webassembly_debug.zip \
            templates/linux_x11_64_release templates/linux_x11_64_debug templates/osx.zip templates/android_release.apk templates/android_debug.apk templates/android_source.zip templates/iphone.zip \
            templates/version.txt -d "$tpl"
          rm godot.zip templates.tpz

      - name: Import project
        if: steps.version.outputs.exists == 'false'
        run: |
          cp .github/godot/export_presets.cfg export_presets.cfg
          # What a downloaded game pack (iOS updates) must match in the installed app:
          # the autoload list and the script classes (scripts/PackUpdate.gd, Online.gd).
          { sed -n '/^\[autoload\]/,/^\[/p' project.godot; grep '^_global_script_class' project.godot; } | sha1sum | cut -c1-16 > pack_compat.txt
          cp pack_compat.txt chromia-ios-compat.txt
          # A fresh checkout has no .import cache; let the editor import everything once.
          # The editor never exits on its own, so stop it once .import stops growing for 60s.
          "$GODOT" --no-window --editor --path . > import.log 2>&1 &
          pid=$!
          prev=-1; stable=0
          for i in $(seq 1 180); do
            sleep 5
            n=$(ls .import 2>/dev/null | wc -l)
            if [ "$n" -gt 0 ] && [ "$n" = "$prev" ]; then stable=$((stable + 1)); else stable=0; fi
            prev=$n
            [ "$stable" -ge 12 ] && break
          done
          kill "$pid" || true
          wait "$pid" || true
          echo "imported $prev files"

      - name: Check the game starts
        if: steps.version.outputs.exists == 'false'
        run: |
          # Start the game and require it to reach the menu (scripts/ui/menu/Sidebar.gd
          # prints CHROMIA_BOOT_OK and quits), so a script error can't ship a build
          # that closes as soon as it opens.
          mkdir -p "$RUNNER_TEMP/boot-home"
          HOME="$RUNNER_TEMP/boot-home" CHROMIA_BOOT_CHECK=1 timeout 240 "$GODOT" --path . > boot.log 2>&1 || true
          grep "SCRIPT ERROR" -A1 boot.log | head -40 || true
          if ! grep -q CHROMIA_BOOT_OK boot.log; then
            echo "::error::The game did not reach the menu; not releasing."
            tail -60 boot.log
            exit 1
          fi
          echo "The game started and reached the menu."

      - name: Export Windows build
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          "$GODOT" --no-window --path . --export "Windows Desktop" "$PWD/dist/Chromia.exe"
          test -f dist/Chromia.exe && test -f dist/Chromia.pck
          # Put the Chromia icon on the exe (replaces the template's GODOT_ICON group).
          npx -y resedit-cli@2.0.0 --in dist/Chromia.exe --out dist/Chromia-icon.exe --icon GODOT_ICON,icon.ico
          mv dist/Chromia-icon.exe dist/Chromia.exe
          (cd dist && zip -q -r "../chromia-windows.zip" .)
          # Installs from before the renames look for Furria.pck / Savia.pck when updating.
          mkdir -p legacy && cp dist/Chromia.pck legacy/Furria.pck && cp dist/Chromia.pck legacy/Savia.pck

      - name: Export web build
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p web-dist
          "$GODOT" --no-window --path . --export "HTML5" "$PWD/web-dist/index.html"
          test -f web-dist/index.pck && test -f web-dist/index.wasm
          rm -rf web-dist/actions
          # the privacy policy (iloverhythia.github.io/Chromia/privacy.html, for the stores)
          cp web/privacy.html web-dist/privacy.html
          (cd web-dist && zip -q -r "../chromia-web.zip" .)

      - name: Export Linux build
        if: steps.version.outputs.exists == 'false'
        continue-on-error: true
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p linux-dist
          "$GODOT" --no-window --path . --export "Linux/X11" "$PWD/linux-dist/Chromia.x86_64"
          test -f linux-dist/Chromia.x86_64 && test -f linux-dist/Chromia.pck
          chmod +x linux-dist/Chromia.x86_64
          (cd linux-dist && zip -q -r "../chromia-linux.zip" .)

      - name: Export macOS build
        if: steps.version.outputs.exists == 'false'
        continue-on-error: true
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          "$GODOT" --no-window --path . --export "Mac OSX" "$PWD/chromia-macos.zip"
          test -f "chromia-macos.zip"

      # Signed with .github/android/chromia.keystore unless the repository has
      # ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets.
      # Keep using the same key: Android only installs an update signed with the same key.
      - name: Export Android build
        if: steps.version.outputs.exists == 'false'
        continue-on-error: true
        env:
          TAG: ${{ steps.version.outputs.tag }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ks="$PWD/.github/android/chromia.keystore"; pass="chromia-android"; alias="chromia"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ks="$RUNNER_TEMP/release.keystore"; pass="$KS_PASS"; alias="$KS_ALIAS"
          fi
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-3.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=2]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/debug_keystore = "$ks"
          export/android/debug_keystore_user = "$alias"
          export/android/debug_keystore_pass = "$pass"
          SETTINGS
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-3.tres"
          # every release gets a higher version code so it installs over the last one
          sed -i "s|^keystore/release=\"\"|keystore/release=\"$ks\"|; s|^keystore/release_user=\"\"|keystore/release_user=\"$alias\"|; s|^keystore/release_password=\"\"|keystore/release_password=\"$pass\"|; s|^version/code=1$|version/code=$GITHUB_RUN_NUMBER|; s|^version/name=\"1.0\"|version/name=\"$TAG\"|" export_presets.cfg
          "$GODOT" --no-window --path . --export "Android" "$PWD/chromia-android.apk"
          test -f "chromia-android.apk"

      # iOS: Godot can only write the Xcode project here (its game pack goes into
      # the .ipa and the in-app updates). Exported last because it turns off the
      # GLES2 fallback (every iPhone/iPad Chromia can run on has GLES3).
      - name: Export iOS Xcode project
        if: steps.version.outputs.exists == 'false'
        id: ios
        continue-on-error: true
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sed -i 's/^quality\/driver\/fallback_to_gles2=true/quality\/driver\/fallback_to_gles2=false/' project.godot
          mkdir -p ios-dist
          "$GODOT" --no-window --path . --export "iOS" "$PWD/ios-dist/Chromia.ipa" || true
          test -d ios-dist/Chromia.xcodeproj && test -f ios-dist/Chromia.pck
          cp ios-dist/Chromia.pck chromia-ios.pck # in-app updates (scripts/PackUpdate.gd)
          rm -rf ios-dist/actions
          (cd ios-dist && zip -q -r -y "../chromia-ios-xcode.zip" .)
          git checkout project.godot

      # The iOS app's engine is the same in every release; only its game pack
      # changes. So the .ipa is made here from the last released one with the
      # new pack inside. (Building one from scratch needs a Mac with Xcode,
      # only if the Godot engine version changes.)
      - name: iOS .ipa from the last one
        if: steps.version.outputs.exists == 'false' && steps.ios.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base-ipa
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 40 --json tagName -q '.[].tagName'); do
            if gh release download "$t" --repo "$GITHUB_REPOSITORY" --pattern chromia-ios.ipa --dir base-ipa 2>/dev/null; then
              echo "starting from the $t app"
              break
            fi
          done
          test -f base-ipa/chromia-ios.ipa
          mkdir ipa-work && cd ipa-work
          unzip -q ../base-ipa/chromia-ios.ipa
          app=$(ls -d Payload/*.app | head -n1)
          test -f "$app/Chromia.pck"
          cp ../ios-dist/Chromia.pck "$app/Chromia.pck"
          # the iPhone file picker (native code the in-app updates can't add)
          bash ../.github/scripts/build_ios_picker.sh "$PWD/$app" || echo "::warning::iPhone file picker not built"
          python3 ../.github/scripts/ipa_icons.py "$app" .. "$GITHUB_RUN_NUMBER"
          zip -q -r -y ../chromia-ios.ipa Payload

      # Meta Quest (standalone VR): an Android app that starts in VR with OpenXR
      # (GodotVR/godot_openxr). Made on a copy of the project, turned into the
      # Quest project by .github/scripts/prepare_quest.sh, with Godot's Android
      # gradle build (OpenXR needs it, and it runs on Java 11). Signed like the
      # Android build (the Android step sets the keystore and version code).
      # chromia-quest.pck + chromia-quest-compat.txt are its in-app updates
      # (scripts/PackUpdate.gd), like the iPhone's.
      - name: Export Meta Quest build
        if: steps.version.outputs.exists == 'false'
        continue-on-error: true
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2" > /dev/null
          curl -sSL -o "$RUNNER_TEMP/godot-openxr.zip" -L "https://github.com/GodotVR/godot_openxr/releases/download/1.3.0/godot-openxr.zip"
          tpl="$HOME/.local/share/godot/templates/${GODOT_VERSION}.stable"
          q="$RUNNER_TEMP/quest"
          mkdir -p "$q"
          tar cf - --exclude=./.git --exclude=./dist --exclude=./web-dist --exclude=./ios-dist --exclude=./ipa-work --exclude=./base-ipa --exclude='./*.zip' --exclude='./*.apk' --exclude='./*.ipa' --exclude='./*.pck' . | (cd "$q" && tar xf -)
          cd "$q"
          git -C "$GITHUB_WORKSPACE" show HEAD:project.godot > project.godot # (the iOS step changed it)
          bash .github/scripts/prepare_quest.sh "$tpl/android_source.zip" "$RUNNER_TEMP/godot-openxr.zip"
          mkdir -p "$q/out"
          export JAVA_HOME="${JAVA_HOME_11_X64}" PATH="${JAVA_HOME_11_X64}/bin:$PATH" ANDROID_SDK_ROOT="$sdk"
          "$GODOT" --no-window --path . --export "Quest" "$q/out/chromia-quest.apk"
          test -f "$q/out/chromia-quest.apk"
          "$GODOT" --no-window --path . --export-pack "Quest" "$q/out/chromia-quest.pck"
          test -f "$q/out/chromia-quest.pck"
          cp "$q/out/chromia-quest.apk" "$q/out/chromia-quest.pck" "$GITHUB_WORKSPACE/"
          cp "$GITHUB_WORKSPACE/pack_compat.txt" "$GITHUB_WORKSPACE/chromia-quest-compat.txt"

      # Meta Horizon Store version (chromia-quest-store.apk): no self-updates (the
      # store updates it), Android 10+, its own package name. Signed like the
      # Android build, or with the QUEST_STORE_KEYSTORE_BASE64 / _PASSWORD /
      # _ALIAS secrets if they exist. The store only takes builds signed with the
      # key of the first one uploaded, so don't change keys after that.
      # With META_APP_ID and META_APP_SECRET secrets (developers.meta.com >
      # your app > API) every release is uploaded to the store's release channel
      # META_CHANNEL (repository variable, default ALPHA: private testers).
      - name: Meta Horizon Store build and upload
        if: steps.version.outputs.exists == 'false'
        continue-on-error: true
        env:
          TAG: ${{ steps.version.outputs.tag }}
          KS_B64: ${{ secrets.QUEST_STORE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.QUEST_STORE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.QUEST_STORE_KEY_ALIAS }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_CHANNEL: ${{ vars.META_CHANNEL }}
        run: |
          q="$RUNNER_TEMP/quest"
          test -f "$q/android/.build_version" # made by the Quest step
          cd "$q"
          if [ -n "$KS_B64" ]; then
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/store.keystore"
          KS="$RUNNER_TEMP/store.keystore" python3 - <<'PY'
          import os, re
          p = "export_presets.cfg"
          s = open(p).read()
          i = s.index("[preset.7.options]")
          head, opts = s[:i], s[i:]
          for k, v in (("keystore/release", os.environ["KS"]), ("keystore/release_user", os.environ["KS_ALIAS"]), ("keystore/release_password", os.environ["KS_PASS"])):
              opts = re.sub(r'^%s=".*"$' % re.escape(k), '%s="%s"' % (k, v.replace("\\", "\\\\").replace('"', '\\"')), opts, count=1, flags=re.M)
          open(p, "w").write(head + opts)
          PY
          fi
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export JAVA_HOME="${JAVA_HOME_11_X64}" PATH="${JAVA_HOME_11_X64}/bin:$PATH" ANDROID_SDK_ROOT="$sdk"
          mkdir -p "$q/out-store"
          "$GODOT" --no-window --path . --export "QuestStore" "$q/out-store/chromia-quest-store.apk"
          test -f "$q/out-store/chromia-quest-store.apk"
          cp "$q/out-store/chromia-quest-store.apk" "$GITHUB_WORKSPACE/"
          if [ -z "$META_APP_ID" ] || [ -z "$META_APP_SECRET" ]; then
            echo "::notice::No META_APP_ID / META_APP_SECRET secrets: not uploaded to the store"
            exit 0
          fi
          curl -sSL -o "$RUNNER_TEMP/ovr-platform-util" -L "https://www.oculus.com/download_app/?id=5159709737372459"
          chmod +x "$RUNNER_TEMP/ovr-platform-util"
          "$RUNNER_TEMP/ovr-platform-util" upload-quest-build --app-id "$META_APP_ID" --app-secret "$META_APP_SECRET" \
            --apk "$q/out-store/chromia-quest-store.apk" --channel "${META_CHANNEL:-ALPHA}" \
            --age-group TEENS_AND_ADULTS --notes "Chromia $TAG" --disable-progress-bar

      # The browser version on GitHub Pages (Settings > Pages > branch gh-pages):
      # replaced on every release, so the branch never grows.
      - name: Publish web build to gh-pages
        if: steps.version.outputs.exists == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cd web-dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Chromia $TAG (web)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          notes="$NOTES"
          if [ -z "$notes" ]; then
            notes="Chromia $TAG.
          - Windows: unzip chromia-windows.zip and run Chromia.exe (existing installs update automatically).
          - Linux: unzip chromia-linux.zip and run Chromia.x86_64 (updates automatically too).
          - macOS: unzip chromia-macos.zip and open Chromia.app (first time: right-click > Open).
          - Android: install chromia-android.apk (allow installing from your browser/files app).
          - Meta Quest: sideload chromia-quest.apk (SideQuest, or adb install). It starts in VR and updates itself.
          - iOS: chromia-ios.ipa, install with a sideloading app such as AltStore or Sideloadly (or use the browser version).
          - Browser: https://iloverhythia.github.io/Chromia/ or chromia-web.zip on any web server."
            notes=$(printf '%s' "$notes" | sed 's/^          //')
          fi
          files=("chromia-windows.zip" "chromia-web.zip" dist/Chromia.pck legacy/Furria.pck legacy/Savia.pck)
          # the other platforms are attached when their export worked
          for f in "chromia-linux.zip" "chromia-macos.zip" "chromia-android.apk" "chromia-ios.ipa" "chromia-ios.pck" "chromia-ios-compat.txt" "chromia-quest.apk" "chromia-quest.pck" "chromia-quest-compat.txt" "chromia-quest-store.apk"; do
            [ -f "$f" ] && files+=("$f")
          done
          gh release create "$TAG" "${files[@]}" \
            --target "$GITHUB_SHA" --title "Chromia $TAG" --notes "$notes"
