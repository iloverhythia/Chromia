name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (e.g. sep27-2026-recovered)"
        required: true
      title:
        description: "Release title (defaults to the tag)"
        required: false
      notes:
        description: "Release notes"
        required: false
        default: "Godot 3.5 project source. Open project.godot in Godot 3.5.x."

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source zip
        run: git archive --format=zip --prefix=savia/ -o "savia-${{ inputs.tag }}.zip" HEAD

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" "savia-${{ inputs.tag }}.zip" \
            --target "${{ github.sha }}" \
            --title "${{ inputs.title || inputs.tag }}" \
            --notes "${{ inputs.notes }}"
