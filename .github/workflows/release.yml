name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (e.g. sep27-2026-recovered)"
        required: true
      title:
        description: "Release title (defaults to the tag)"
        required: false
      notes:
        description: "Release notes"
        required: false
        default: "Godot 3.5 project source. Open project.godot in Godot 3.5.x."

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip and create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title || inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          git archive --format=zip --prefix=savia/ -o "savia-$TAG.zip" HEAD
          gh release create "$TAG" "savia-$TAG.zip" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
